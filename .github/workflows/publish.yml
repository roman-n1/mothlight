name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check release coordinates
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^mothlightVersion=//p' gradle.properties)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ||
                "${version^^}" == *-SNAPSHOT || "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Expected tag v<release version> matching mothlightVersion in gradle.properties."
            exit 1
          fi
  verify:
    needs: version
    uses: ./.github/workflows/verify.yml
  prepare:
    name: Prepare unsigned Maven repository
    if: github.event_name == 'workflow_dispatch' || vars.MAVEN_CENTRAL_PUBLISH_ENABLED != 'true'
    needs: verify
    timeout-minutes: 45
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew publishAllPublicationsToReleaseCheckRepository -PmothlightPublicationRepository="$RUNNER_TEMP/maven" --no-configuration-cache --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-maven-repository
          path: ${{ runner.temp }}/maven
          if-no-files-found: error
  publish:
    name: Release to Maven Central
    if: github.event_name == 'release' && vars.MAVEN_CENTRAL_PUBLISH_ENABLED == 'true'
    needs: verify
    timeout-minutes: 60
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Sign and publish all libraries
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_KEY_CONTENTS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralDeploymentValidation: PUBLISHED
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required publication secret: $name"
              exit 1
            fi
          done
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" ]]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKeyId
          fi
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" ]]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
          fi
          ./gradlew publishAndReleaseToMavenCentral -PmothlightPublishToCentral=true --no-configuration-cache --max-workers=2
