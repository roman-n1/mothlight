name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check release coordinates
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^mothlightVersion=//p' gradle.properties)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ||
                "${version^^}" == *-SNAPSHOT || "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Expected tag v<release version> matching mothlightVersion in gradle.properties."
            exit 1
          fi
  verify:
    needs: version
    uses: ./.github/workflows/verify.yml
  consumer:
    needs: version
    uses: ./.github/workflows/published-consumer.yml
    with:
      core-release-only: true
  prepare:
    name: Prepare Maven repository and check Central quota
    needs: [verify, consumer]
    timeout-minutes: 45
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew publishAllPublicationsToReleaseCheckRepository -PmothlightReleaseCoreOnly=true -PmothlightPublicationRepository="$RUNNER_TEMP/maven" --no-configuration-cache --max-workers=2
      - name: Estimate Central usage and check remaining quota
        shell: bash
        env:
          CENTRAL_PUBLISH_ENABLED: ${{ vars.MAVEN_CENTRAL_PUBLISH_ENABLED }}
          CENTRAL_REMAINING_FILES: ${{ vars.MAVEN_CENTRAL_REMAINING_FILES }}
          CENTRAL_REMAINING_BYTES: ${{ vars.MAVEN_CENTRAL_REMAINING_BYTES }}
        run: |
          version=$(sed -n 's/^mothlightVersion=//p' gradle.properties)
          options=()
          if [[ -n "$CENTRAL_REMAINING_FILES" ]]; then
            options+=("--max-files=$CENTRAL_REMAINING_FILES")
          fi
          if [[ -n "$CENTRAL_REMAINING_BYTES" ]]; then
            options+=("--max-bytes=$CENTRAL_REMAINING_BYTES")
          fi
          if [[ "$GITHUB_EVENT_NAME" == release && "$CENTRAL_PUBLISH_ENABLED" == true ]]; then
            options+=(--require-budget)
          fi
          python3 scripts/check_central_budget.py "$RUNNER_TEMP/maven" "$version" "${options[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unsigned-maven-repository
          path: ${{ runner.temp }}/maven
          if-no-files-found: error
  publish:
    name: Release to Maven Central
    if: github.event_name == 'release' && vars.MAVEN_CENTRAL_PUBLISH_ENABLED == 'true'
    needs: prepare
    timeout-minutes: 60
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Sign and publish the release libraries
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_KEY_CONTENTS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralDeploymentValidation: PUBLISHED
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required publication secret: $name"
              exit 1
            fi
          done
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" ]]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKeyId
          fi
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" ]]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
          fi
          ./gradlew publishAndReleaseToMavenCentral -PmothlightReleaseCoreOnly=true -PmothlightPublishToCentral=true --no-configuration-cache --max-workers=2
